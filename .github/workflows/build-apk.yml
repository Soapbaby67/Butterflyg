name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки APK'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Found app/google-services.json in repository."
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            trimmed="$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]')"
            if [[ "$trimmed" == \{* ]]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            fi
            echo "Restored app/google-services.json from GitHub Secret."
          else
            echo "::error::Missing app/google-services.json! Copy app/google-services.json from AI Studio and save it as GitHub repository secret GOOGLE_SERVICES_JSON (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Licenses
        run: |
          set +o pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_DIR"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eab09855fdaf4210aaab9d6ac7\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"

          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            echo "Found sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-36" "build-tools;36.0.0" || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-36.1" || true
          else
            echo "cmdline-tools sdkmanager not found, relying on license files and Gradle auto-download"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: gradle assembleDebug --console=plain

      - name: Prepare release keystore
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: GitHub Secret KEYSTORE_BASE64 is required for release builds."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: chronicles-of-butterfly-${{ github.event.inputs.build_type || 'debug' }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
