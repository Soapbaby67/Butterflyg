name: Generate Permanent Debug Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    name: Create Keystore & SHA Fingerprints
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate permanent debug keystore
        run: |
          mkdir -p keystore-output
          keytool -genkeypair -v -keystore keystore-output/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          base64 -w 0 keystore-output/debug.keystore > keystore-output/debug-keystore-base64.txt

          CERT_INFO=$(keytool -list -v -keystore keystore-output/debug.keystore -alias androiddebugkey -storepass android -keypass android)
          SHA1=$(printf '%s\n' "$CERT_INFO" | grep -m1 'SHA1:' | grep -oE '([0-9A-F]{2}:){19}[0-9A-F]{2}')
          SHA256=$(printf '%s\n' "$CERT_INFO" | grep -m1 'SHA256:' | grep -oE '([0-9A-F]{2}:){31}[0-9A-F]{2}')

          {
            echo "SHA-1:  $SHA1"
            echo "SHA-256: $SHA256"
            echo ""
            echo "1) Откройте debug-keystore-base64.txt и сохраните его содержимое в секрет GitHub: DEBUG_KEYSTORE_BASE64"
            echo "2) Добавьте SHA-1 и SHA-256 в Firebase Console -> Project Settings -> Your apps (com.aistudio.rpgchronicles.kzmwqr)."
          } > keystore-output/sha-fingerprints.txt

          {
            echo "### Постоянный ключ создан"
            echo ""
            echo "- **SHA-1:** \`$SHA1\`"
            echo "- **SHA-256:** \`$SHA256\`"
            echo ""
            echo "1. Скачайте артефакт \`permanent-debug-keystore\` ниже и скопируйте всё содержимое \`debug-keystore-base64.txt\` в секрет **`DEBUG_KEYSTORE_BASE64`**."
            echo "2. Добавьте этот **SHA-1** (и при желании **SHA-256**) в **Firebase Console** → Project Settings → Android-приложение \`com.aistudio.rpgchronicles.kzmwqr\`."
            echo "3. После сохранения секрета удалите этот запуск workflow через меню \`...\` → **Delete workflow run**, чтобы файл ключа не оставался в артефактах."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore artifact (1 day retention)
        uses: actions/upload-artifact@v7
        with:
          name: permanent-debug-keystore
          path: |
            keystore-output/debug-keystore-base64.txt
            keystore-output/sha-fingerprints.txt
          retention-days: 1
